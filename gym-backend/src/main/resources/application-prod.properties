# Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Dialecto específico
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Secreto JWT (Obligatorio desde variable de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}



logging.level.org.springframework.security=DEBUG
#Para que añada solo lo mas importante
logging.level.root=INFO 
# Para detallar mas el debug de mi paquete
logging.level.com.backend=INFO
# Para detallar mas el debug de Spring
logging.level.org.springframework=INFO
#definir como se veran los errores en la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
