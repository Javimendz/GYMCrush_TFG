spring.application.name=api
# Perfil activo
spring.profiles.active=dev

# Base de Datos (Docker inyectará estos valores)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true
# Configuración de Jackson para JSON, que se vea bonito en las respuestas
spring.jackson.serialization.indent_output=true

# Integración FatSecret
fatsecret.client.id=${FATSECRET_CLIENT_ID}
fatsecret.client.secret=${FATSECRET_CLIENT_SECRET}
fatsecret.oauth.url=https://oauth.fatsecret.com/connect/token
fatsecret.api.url=https://platform.fatsecret.com/rest/server.api


