# docker-compose.yaml
services:
  # MICROSERVICIO 1, backend API 
  api-service:
    build: ./gym-backend     # Construye desde la carpeta del backend
    container_name: gym-backend-api
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - gym-net
    environment:
      # variables de entorno para la conexion a la bd y otras configs
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-service:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_PROFILES_ACTIVE=dev
      - FATSECRET_CLIENT_ID=${FATSECRET_CLIENT_ID}
      - FATSECRET_CLIENT_SECRET=${FATSECRET_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      db-service:
        condition: service_healthy

  # MICROSERVICIO 2
  db-service:
    build: ./gym-db          # Construye desde la carpeta de la BD
    container_name: gym-database
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - gym-net
    ports:
      - "5432:5432"
    volumes:
      - gym_db_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s    # Le damos 10 segundos entre intentos
      timeout: 5s
      retries: 5

  
networks:
  gym-net:
    driver: bridge

volumes:
  gym_db_data: {}