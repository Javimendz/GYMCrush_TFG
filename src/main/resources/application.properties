#DOCKER
# DEJA ESTO (para que use las variables de Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ELIMINA O COMENTA ESTA LÍNEA (esta es la que causa el error)
# spring.datasource.driverClassName=org.h2.Driver 

# Dialecto para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Habilitar la auto-actualización de la base de datos para que no borre tablas
spring.jpa.hibernate.ddl-auto=update
# Configuración de JWT 
#si cambio la clave, todos los usuarios se desloguean, dado que los tokens no tendran validez
jwt.secret=EstaEsUnaClaveSuperLargaYTotalmenteSeguraDeMasDeSesentaYCuatroCaracteresParaQueElAlgoritmoHS512NoSeQueje#10 minutos caduca
jwt.expiration=600000